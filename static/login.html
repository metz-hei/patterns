<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff;
            color-scheme: light;
        }

        .digit-input {
            width: 80px;
            height: 100px;
            text-align: center;
            font-size: 48px;
            font-family: 'Roboto Mono', monospace;
            margin: 0 4px;
            border-radius: 12px;
            background-color: #F6F7F8;
            border: 2px solid transparent;
            text-transform: uppercase;
        }

        .digit-input:focus {
            outline: none;
            border-color: #000;
        }

        #passwordInputs {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bottom-links {
            position: fixed;
            bottom: 30px;
            left: 0;
            right: 0;
            text-align: center;
        }

        .link {
            font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, sans-serif;
            font-size: 1.25rem;
            line-height: 1.65;
            color: #000;
            text-decoration: none;
        }

        .link:hover {
            color: #000;
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 0.15em;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .shake {
            animation: shake 0.6s ease-in-out;
        }

        @media (max-width: 480px) {
            body {
                padding: 16px 0;
            }

            #passwordInputs {
                gap: 8px;
            }

            .digit-input {
                width: 44px;
                height: 60px;
                font-size: 36px;
                border-radius: 10px;
                margin: 0;
            }

            .bottom-links {
                bottom: 16px;
            }

            .link {
                display: inline-block;
            }
        }
    </style>
</head>
<body>
    <div>
        <form id="loginForm">
            <div id="passwordInputs">
                <input type="text" inputmode="text" maxlength="1" class="digit-input" data-index="0" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input type="text" inputmode="text" maxlength="1" class="digit-input" data-index="1" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input type="text" inputmode="text" maxlength="1" class="digit-input" data-index="2" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input type="text" inputmode="text" maxlength="1" class="digit-input" data-index="3" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input type="text" inputmode="text" maxlength="1" class="digit-input" data-index="4" autocomplete="off" autocapitalize="off" spellcheck="false">
                <input type="text" inputmode="text" maxlength="1" class="digit-input" data-index="5" autocomplete="off" autocapitalize="off" spellcheck="false">
            </div>
        </form>
        <div class="bottom-links">
            <a href="https://t.me/MihailShamin" class="link">Не помню код</a>
        </div>
    </div>

    <script>
        const digitInputs = document.querySelectorAll('.digit-input');

        function safeReturnUrl(raw) {
            if (!raw || raw.charAt(0) !== '/' || raw.indexOf('//') === 0 || raw.indexOf('://') !== -1) {
                return '/';
            }
            if (raw === '/login' || raw.indexOf('/login.html') === 0 || raw.indexOf('/login?') === 0) {
                return '/';
            }
            return raw;
        }

        const CHAR_RE = /^[a-zA-Z0-9]$/;

        digitInputs[0].focus();

        digitInputs.forEach((input, index) => {
            input.addEventListener('input', function(e) {
                const value = e.target.value;

                if (!CHAR_RE.test(value)) {
                    e.target.value = '';
                    return;
                }

                e.target.value = value.toUpperCase();

                if (value && index < digitInputs.length - 1) {
                    digitInputs[index + 1].focus();
                }

                checkPasswordComplete();
            });

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    digitInputs[index - 1].focus();
                }
            });

            input.addEventListener('paste', function(e) {
                const text = (e.clipboardData || window.clipboardData).getData('text') || '';
                const chars = (text.match(/[a-zA-Z0-9]/g) || []).slice(0, 6);
                if (!chars.length) return;
                e.preventDefault();
                digitInputs.forEach((field, i) => {
                    field.value = chars[i] ? chars[i].toUpperCase() : '';
                });
                const next = Math.min(chars.length, digitInputs.length - 1);
                digitInputs[next].focus();
                checkPasswordComplete();
            });
        });

        function checkPasswordComplete() {
            const password = Array.from(digitInputs).map(input => input.value.toUpperCase()).join('');
            if (password.length === 6) {
                authenticate(password);
            }
        }

        function shakeForm() {
            digitInputs.forEach(input => input.value = '');
            digitInputs[0].focus();
            document.getElementById('loginForm').classList.add('shake');
            setTimeout(() => {
                document.getElementById('loginForm').classList.remove('shake');
            }, 600);
        }

        async function authenticate(password) {
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (data.success) {
                    const params = new URLSearchParams(window.location.search);
                    let returnUrl = params.get('return');
                    if (!returnUrl) {
                        try {
                            returnUrl = sessionStorage.getItem('returnUrl') || '/';
                            sessionStorage.removeItem('returnUrl');
                        } catch (e) {
                            returnUrl = '/';
                        }
                    }
                    window.location.href = safeReturnUrl(returnUrl);
                } else {
                    shakeForm();
                }
            } catch (error) {
                shakeForm();
            }
        }
    </script>
</body>
</html>
